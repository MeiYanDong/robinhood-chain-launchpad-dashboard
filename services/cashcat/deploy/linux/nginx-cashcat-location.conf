# Include this file inside the existing robinhood-chain-radar server block.
location = /cashcat {
    return 308 /cashcat/;
}

location /cashcat/ {
    limit_req zone=robinhood_radar_per_ip burst=30 nodelay;
    limit_req_status 429;

    # The public surface is evidence-only. Background scheduling performs collection;
    # run/narrative/report-generation POST routes remain loopback-only.
    limit_except GET HEAD {
        deny all;
    }

    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /cashcat;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
}
