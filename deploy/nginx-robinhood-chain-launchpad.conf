server {
    listen 4174;
    listen [::]:4174;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json;

    # Move legacy browser entries to the canonical port-80 product routes while
    # preserving the existing port-4174 API surface for integrations.
    location = / {
        return 308 http://$host/launchpads/;
    }

    location = /leaders {
        return 308 http://$host/leaders/;
    }

    location = /leaders/ {
        return 308 http://$host/leaders/;
    }

    location = /launchpads {
        return 308 http://$host/launchpads/;
    }

    location = /launchpads/ {
        return 308 http://$host/launchpads/;
    }

    location = /pair-flow {
        return 308 http://$host/pair-flow/;
    }

    location = /pair-flow/ {
        return 308 http://$host/pair-flow/;
    }

    location = /pair-v2 {
        return 308 http://$host/pair-v2/;
    }

    location = /pair-alpha {
        return 308 http://$host/pair-alpha/;
    }

    location = /pair-alpha/ {
        return 308 http://$host/pair-alpha/;
    }

    location = /pair-v2/ {
        return 308 http://$host/pair-v2/;
    }

    location = /cashcat {
        return 308 http://$host/cashcat/;
    }

    location = /cashcat/ {
        return 308 http://$host/cashcat/;
    }

    location = /api/refresh {
        limit_req zone=robinhood_launchpad_refresh_per_ip burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    location = /api/pair/refresh {
        limit_req zone=robinhood_launchpad_refresh_per_ip burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    location = /api/pair/flow/refresh {
        limit_req zone=robinhood_launchpad_refresh_per_ip burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    location = /api/pair/v2/refresh {
        limit_req zone=robinhood_launchpad_refresh_per_ip burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    location = /api/pair/alpha/refresh {
        limit_req zone=robinhood_launchpad_refresh_per_ip burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    location = /api/pair/reports/generate {
        return 403;
    }

    location = /api/long/refresh {
        limit_req zone=robinhood_launchpad_refresh_per_ip burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4175;
