# Include these locations inside the existing public :80 Robinhood Chain server block.
# The trailing slash on proxy_pass strips the public product prefix before forwarding.

location = /leaders {
    return 308 /leaders/;
}

location = /leaders/api/intelligence/refresh {
    limit_req zone=robinhood_launchpad_refresh_per_ip burst=1 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:4175/api/intelligence/refresh;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
}

location /leaders/ {
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:4175/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /leaders;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
}

