server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript;

    ssl_certificate /etc/letsencrypt/live/47.251.99.37/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.251.99.37/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RobinhoodChainTLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cashcat-sentinel.conf;
    include /etc/nginx/snippets/robinhood-chain-intelligence.conf;

    location / {
        limit_req zone=robinhood_radar_per_ip burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
